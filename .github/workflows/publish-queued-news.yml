name: Publish Queued News

on:
  schedule:
    - cron: "5 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish due queued news
        run: |
          npm run validate:queued-news
          npm run publish:queued-news

      - name: Commit and push published news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/news public/images/news news-published news-failed news-queue
          if git diff --cached --quiet; then
            echo "No queued news changes to commit."
            exit 0
          fi
          git commit -m "Publish scheduled news"
          git push origin HEAD:main
